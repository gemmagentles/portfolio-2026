<!--
  The arrows and "Home · 1 of 3" line under a case study's hero carousel. Set on the include:
  - status: the line before the script takes over, e.g. "Home · 1 of 3" (the front screen's name and the count)
  Styles: .work-showcase in src/scss/pages/_work.scss; script: src/js/modules/showcase.js.
-->
<div class="work-showcase__controls">
  <button class="work-showcase__arrow" type="button" aria-label="Previous page" data-showcase-prev>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
  </button>
  <p class="work-showcase__status" aria-live="polite" data-showcase-status>{{status}}</p>
  <button class="work-showcase__arrow" type="button" aria-label="Next page" data-showcase-next>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
  </button>
</div>
