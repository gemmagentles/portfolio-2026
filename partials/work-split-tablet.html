<!--
  A 50/50 row's picture: a screenshot in a drawn iPad in landscape. Set on the include: image, width, height (captured
  at iPad size, 1180 x 820, so 2360 x 1640 at 2x), alt.
-->
<figure class="work-split__shot work-split__shot--tablet">
  <div class="work-split__tablet">
    <div class="work-split__tablet-device">
      <span class="work-split__glass" aria-hidden="true"></span>
      <img src="{{image}}" alt="{{alt}}" width="{{width}}" height="{{height}}" loading="lazy" decoding="async" />
    </div>
  </div>
</figure>
