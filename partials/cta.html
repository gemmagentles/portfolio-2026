<!--
  Call to action above the footer, on the brand gradient, with a giant outlined word behind it and a button (from the
  CTA in the V5 Studio design). Reusable: pass the copy in as attributes on the include (see index.html and
  work-v3/index.html):

  - eyebrow: the small line above the heading
  - title, title2, accent: the heading's first line, the start of its second line, and its black last word
  - ghost: the giant outlined word behind it
  - button, href: the button's text and where it goes
  - target, note: "_blank" and " (opens in a new tab)" for a link to another site; "_self" and "" otherwise
  Attributes can't contain ">" or double quotes, so keep the copy to plain text.
-->
<section class="cta" aria-labelledby="cta-title">
  <div class="cta__backdrop" aria-hidden="true"><span class="cta__ghost">{{ghost}}</span></div>

  <div class="container cta__inner" data-reveal>
    <div>
      <p class="cta__eyebrow">{{eyebrow}}</p>
      <h2 class="cta__title" id="cta-title">{{title}}<br /> {{title2}} <span class="cta__accent">{{accent}}</span></h2>
    </div>

    <a class="cta__button" href="{{href}}" target="{{target}}" rel="noopener">
      {{button}}<span class="visually-hidden">{{note}}</span>
      <span class="cta__arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </span>
    </a>
  </div>
</section>
