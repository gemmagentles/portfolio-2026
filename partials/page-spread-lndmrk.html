<!--
  Every LNDMRK page at full length, desktop and mobile side by side, all pages in one full-width row: Home, About and
  Contact (full-length screenshots of lndmrk.co.uk at 1440px and 390px wide). With "Featured project" and "LNDMRK"
  (the page's h1) above it. On narrower screens the row scrolls sideways.
  Styles: src/scss/components/_page-spread.scss.
-->
<section class="page-spread" aria-labelledby="page-spread-title">
  <div class="container page-wall__intro">
    <p class="eyebrow">Featured project</p>
    <h1 class="page-wall__title" id="page-spread-title">LNDMRK</h1>
  </div>

  <ul class="page-spread__row" data-reveal>
    <li class="page-spread__page">
      <p class="page-spread__label">Home</p>
      <div class="page-spread__shots">
        <img class="page-spread__desktop" src="/images/work/lndmrk/desktop-full.webp" alt="The full LNDMRK home page on desktop" width="1440" height="3851" loading="lazy" decoding="async" />
        <img class="page-spread__mobile" src="/images/work/lndmrk/mobile-full.webp" alt="The full LNDMRK home page on mobile" width="780" height="8560" loading="lazy" decoding="async" />
      </div>
    </li>
    <li class="page-spread__page">
      <p class="page-spread__label">About</p>
      <div class="page-spread__shots">
        <img class="page-spread__desktop" src="/images/work/lndmrk/about-full.webp" alt="The full LNDMRK about page on desktop" width="1440" height="2920" loading="lazy" decoding="async" />
        <img class="page-spread__mobile" src="/images/work/lndmrk/about-mobile-full.webp" alt="The full LNDMRK about page on mobile" width="780" height="7628" loading="lazy" decoding="async" />
      </div>
    </li>
    <li class="page-spread__page">
      <p class="page-spread__label">Contact</p>
      <div class="page-spread__shots">
        <img class="page-spread__desktop" src="/images/work/lndmrk/contact-full.webp" alt="The full LNDMRK contact page on desktop" width="1440" height="1299" loading="lazy" decoding="async" />
        <img class="page-spread__mobile" src="/images/work/lndmrk/contact-mobile-full.webp" alt="The full LNDMRK contact page on mobile" width="780" height="3068" loading="lazy" decoding="async" />
      </div>
    </li>
  </ul>
</section>
