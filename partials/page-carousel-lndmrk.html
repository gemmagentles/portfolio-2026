<!--
  LNDMRK's pages in the Work page's carousel (the same component and script as /work/: .work-showcase__carousel in
  src/scss/pages/_work.scss, src/js/modules/showcase.js): Home, About and Contact as browser-window screens, one in
  front and two angled behind. Clicking a screen behind brings it to the front; clicking the front one scrolls down
  to the next section (data-showcase="scroll"). With "Featured project" and "LNDMRK" (the page's h1) above it.
  Only one carousel can be on a page (the script picks up the first). Each screen is partials/showcase-screen.html
  and the arrows partials/showcase-controls.html, shared with the case study template (templates/case-study.html).
-->
<section class="page-carousel" aria-labelledby="page-carousel-title">
  <div class="container">
    <div class="page-wall__intro">
      <p class="eyebrow">Featured project</p>
      <h1 class="page-wall__title" id="page-carousel-title">LNDMRK</h1>
    </div>

    <div class="work-showcase__carousel" data-showcase="scroll" data-reveal>
      <ul class="work-showcase__stage">
        <include src="showcase-screen.html" pos="0" href="/work/lndmrk/" image="/images/work/lndmrk/desktop-full.webp" width="1440" height="3851" alt="The LNDMRK home page" label="LNDMRK" name="Home"></include>
        <include src="showcase-screen.html" pos="1" href="/work/lndmrk/" image="/images/work/lndmrk/about-full.webp" width="1440" height="2920" alt="The LNDMRK about page" label="LNDMRK" name="About"></include>
        <include src="showcase-screen.html" pos="2" href="/work/lndmrk/" image="/images/work/lndmrk/services.webp" width="1440" height="724" alt="The LNDMRK services section" label="LNDMRK" name="Services"></include>
        <include src="showcase-screen.html" pos="-1" href="/work/lndmrk/" image="/images/work/lndmrk/contact-full.webp" width="1440" height="1299" alt="The LNDMRK contact page" label="LNDMRK" name="Contact"></include>
      </ul>

      <include src="showcase-controls.html" status="Home · 1 of 4"></include>
    </div>
  </div>
</section>
