<!--
  The geometric facets behind the hero's phone (from "Hero V15" in the design): a hexagon of six light and dark
  triangles, framed by a solid outline and a slowly turning dashed one, with a few long shards and a soft white glow.
  The shards run far past the box (the SVG shows overflow) so they reach the edges of the hero, which crops them.
  Everything is centred on the phone (the middle of the 1200 x 1200 box, 1190,375 in the design's coordinates).
  The turning and the gentle pulse are in src/scss/pages/_home.scss. Purely decorative.
-->
<svg class="hero__hex" viewBox="590 -225 1200 1200" width="1200" height="1200" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="hero-hex-glow">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <polygon points="-2110,2685 1190,375 -370,2685" fill="rgb(255 255 255 / 0.10)" />
  <polygon points="2690,-1875 1190,375 2690,-375" fill="rgb(11 11 15 / 0.14)" />
  <polygon points="-790,-1875 1190,375 110,-1875" fill="rgb(255 255 255 / 0.08)" />
  <polygon points="2690,1485 1190,375 2690,2685" fill="rgb(255 255 255 / 0.10)" />
  <g class="hero__hex-spin">
    <polygon points="1190,895 740,635 740,115 1190,-145 1640,115 1640,635" fill="none" stroke="rgb(255 255 255 / 0.22)" stroke-width="1.5" stroke-dasharray="6 10" />
  </g>
  <polygon points="1190,795 826,585 826,165 1190,-45 1554,165 1554,585" fill="none" stroke="rgb(255 255 255 / 0.30)" stroke-width="1.5" />
  <g class="hero__hex-pulse">
    <polygon points="1190,375 1190,705 904,540" fill="rgb(255 255 255 / 0.20)" />
    <polygon points="1190,375 904,540 904,210" fill="rgb(11 11 15 / 0.16)" />
    <polygon points="1190,375 904,210 1190,45" fill="rgb(255 255 255 / 0.10)" />
    <polygon points="1190,375 1190,45 1476,210" fill="rgb(11 11 15 / 0.22)" />
    <polygon points="1190,375 1476,210 1476,540" fill="rgb(255 255 255 / 0.14)" />
    <polygon points="1190,375 1476,540 1190,705" fill="rgb(11 11 15 / 0.10)" />
  </g>
  <circle cx="1190" cy="375" r="250" fill="url(#hero-hex-glow)" />
</svg>
