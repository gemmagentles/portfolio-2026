<!--
  A 50/50 row's picture: a phone screenshot in a drawn iPhone, standing on the row's bottom edge with its lower part
  cut off by it. Set on the include: image, width, height (a phone-width screenshot, e.g. 780 wide), alt.
-->
<figure class="work-split__shot work-split__shot--mobile">
  <div class="work-split__phone">
    <div class="work-split__device">
      <span class="work-split__glass" aria-hidden="true"></span>
      <img src="{{image}}" alt="{{alt}}" width="{{width}}" height="{{height}}" loading="lazy" decoding="async" />
    </div>
  </div>
</figure>
