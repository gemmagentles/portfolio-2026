<!--
  A website on the Work page: its screenshot in a browser-window frame, under a see-through black layer with
  a white "View case study" button on top, then its name and type. The whole card is one link, so the button is a span
  styled as a .button (a real link inside a link isn't allowed); on hover the layer darkens a little and the button
  turns purple, like the site's other buttons.
  Attributes: href, image (cropped from the top), width, height (the image's own size), name, type.
-->
<article class="work-card">
  <a class="work-card__link" href="{{href}}">
    <div class="work-card__frame work-card__frame--browser">
      <span class="work-card__bar" aria-hidden="true"><span></span><span></span><span></span></span>
      <img class="work-card__shot" src="{{image}}" alt="" width="{{width}}" height="{{height}}" loading="lazy" decoding="async" />
      <span class="work-card__overlay"><span class="button button--light work-card__more">View case study <span class="work-card__arrow" aria-hidden="true">&rarr;</span></span></span>
    </div>
    <h3 class="work-card__name">{{name}}</h3>
    <p class="work-card__type">{{type}}</p>
  </a>
</article>
