<!--
  "View code" for a project whose repo is private: a button rather than a link. Clicking it tries to open (the arrow
  pushes up and back), then the arrow's two lines reshape into a padlock as the text changes to "Repo private"
  (src/js/modules/private-repo.js, src/scss/components/_repo-button.scss). No settings.
  The arrow is drawn so it can turn into the padlock: the shaft becomes the padlock's loop and the head unfolds into
  its body. Each pair of shapes uses the same drawing steps, which is what lets one flow into the other.
  For a repo you can link to, use view-code.html instead.
-->
<button class="work-split__button work-split__button--ghost repo-button" type="button" data-private-repo>
  <span class="repo-button__text">
    <span class="repo-button__label">View code</span>
    <span class="repo-button__message">Repo private</span>
  </span>
  <svg class="repo-button__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
