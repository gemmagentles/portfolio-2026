<!--
  "Visit site ↗": the black pill linking to a project's live site, in a 50/50 row's buttons. Set on the include:
  - href: the live site; address: how it reads to screen readers (e.g. "lndmrk.co.uk")
  Styles: .work-split__button in src/scss/components/_work-split.scss.
-->
<a class="work-split__button" href="{{href}}" target="_blank" rel="noopener">Visit site <span class="visually-hidden">{{address}} (opens in a new tab)</span><svg class="work-split__arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 17 17 7M8 7h9v9" /></svg></a>
