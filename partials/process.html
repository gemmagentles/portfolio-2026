  My process: a progress bar that steps through each stage (animated by src/js/modules/process.js).
  Add, remove or rename stages by editing the <li>s; the bar adjusts to however many there are.
-->

      <li class="process__step"><span class="process__number">03</span> <span class="process__name">Plan</span></li>
      <li class="process__step"><span class="process__number">04</span> <span class="process__name">Develop</span></li>
      <li class="process__step"><span class="process__number">05</span> <span class="process__name">Test</span></li>
      <li class="process__step"><span class="process__number">06</span> <span class="process__name">Review</span></li>
      <li class="process__step"><span class="process__number">07</span> <span class="process__name">Ship</span></li>
    </ol>
  </div>
