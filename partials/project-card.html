<article class="project-card" data-reveal>
  <a class="project-card__link" href="/work/{{slug}}/">
    <div class="project-card__media">
      <img src="{{image}}" alt="" width="1600" height="1000" loading="lazy" decoding="async" />
    </div>
    <div class="project-card__body">
      <p class="project-card__meta">{{meta}}</p>
      <h3 class="project-card__title">{{name}}</h3>
      <p class="project-card__summary">{{summary}}</p>
      <span class="project-card__more" aria-hidden="true">View case study &rarr;</span>
    </div>
  </a>
</article>
