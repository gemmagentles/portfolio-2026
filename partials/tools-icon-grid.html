<!--
  Tools icon grid: 18 squares, 9 per row on desktop (6 on tablets, 3 on phones), on a black background.
  Logos live in /images/tools/. Each tile shows the logo with the tool name underneath. The name is real text, so
  the logo has an empty alt (screen readers read the name once, not twice). Each tile looks like:
    <li class="tools-icon-grid__item"><img class="tools-icon-grid__icon" src="/images/tools/name.webp" alt="" width="240" height="240" loading="lazy" /> <span class="tools-icon-grid__name">Tool name</span></li>
-->
