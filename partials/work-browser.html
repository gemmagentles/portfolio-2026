<!--
  Work browser: heading and paragraph on the left, a device mockup on the right, on a white background.
  The mockup (/images/devices.webp) shows nuevagold.com on an iMac, MacBook, iPad and iPhone; swap the file to change it.
  (LNDMRK's devices mockup, /images/work/lndmrk/devices.webp, is used in its case study.)
-->
<section class="work-browser" aria-labelledby="work-browser-title">
  <div class="container work-browser__inner">
    <div class="work-browser__text" data-reveal>
      <p class="eyebrow">Chapter V · My Systems Thinking</p>
      <h2 id="work-browser-title"><span class="accent-word">Scalability</span> mindset.</h2>
      <p>
        Every decision I make considers the project as a whole from multiple perspectives.
        Responsive across all devices, accessible to all users and cross-browser compatible. All while thinking about future proofing. 
      </p>
    </div>
    <img
      class="work-browser__image"
      src="/images/devices.webp"
      alt="The Nueva Gold website shown on an iMac, a MacBook, an iPad and an iPhone"
      width="1600"
      height="1246"
      loading="lazy"
      decoding="async"
      data-reveal
    />
  </div>
</section>
