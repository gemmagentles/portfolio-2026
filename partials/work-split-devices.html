<!--
  A 50/50 row's picture: a mockup of the site on several devices, shown whole on the panel's off-white. Set on the
  include: image, width, height, alt.
-->
<figure class="work-split__shot work-split__shot--devices">
  <img src="{{image}}" alt="{{alt}}" width="{{width}}" height="{{height}}" loading="lazy" decoding="async" />
</figure>
