<!--
  A 50/50 row's picture: a plain screenshot filling the panel, cropped to fit. Set on the include: image, width,
  height, alt, and focus: which part of a tall screenshot shows ("0%" the top, "100%" the bottom).
-->
<figure class="work-split__shot" style="--focus: {{focus}}">
  <img src="{{image}}" alt="{{alt}}" width="{{width}}" height="{{height}}" loading="lazy" decoding="async" />
</figure>
