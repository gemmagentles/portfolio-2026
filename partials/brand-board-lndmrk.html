<!--
  The LNDMRK brand guidelines board as a 50/50 row's picture: their wordmark, Didone type, colours, logo and favicon
  (captured from lndmrk.co.uk), on a sand-coloured panel. Used in the LNDMRK case study and work-v4's 50/50 rows.
  Styles: .brand-board in src/scss/components/_work-bento.scss, the panel in _work-split.scss.
-->
<div class="work-split__shot work-split__shot--board">
  <div class="brand-board brand-board--lndmrk">
    <div class="brand-board__panel brand-board__panel--cover">
      <p class="brand-board__wordmark">LNDMRK</p>
      <p class="brand-board__meta"><span>Brand guidelines</span></p>
    </div>
    <div class="brand-board__panel brand-board__panel--type">
      <p class="brand-board__label">Typography</p>
      <p class="brand-board__specimen" aria-hidden="true">A<i>a</i></p>
      <p class="brand-board__note">Didone serif</p>
    </div>
    <div class="brand-board__panel brand-board__panel--colours">
      <p class="brand-board__label">Colours</p>
      <ul class="brand-board__swatches">
        <li style="--swatch: #0b0b0b">#0B0B0B</li>
        <li style="--swatch: #f0efeb">#F0EFEB</li>
        <li style="--swatch: #9a9893">#9A9893</li>
        <li style="--swatch: #d9c9a8">#D9C9A8</li>
      </ul>
    </div>
    <div class="brand-board__panel brand-board__marks">
      <img class="brand-board__logo" src="/images/work/lndmrk/logo.png" alt="LNDMRK logo" width="570" height="120" loading="lazy" decoding="async" />
      <img class="brand-board__favicon" src="/images/work/lndmrk/favicon.png" alt="LNDMRK favicon" width="64" height="64" loading="lazy" decoding="async" />
    </div>
  </div>
</div>
