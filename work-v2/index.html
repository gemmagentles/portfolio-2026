<!doctype html>
<html lang="en">
  <head>
    <include
      src="head.html"
      title="Work (version 2) — Gemma Gentles"
      description="What Gemma Gentles has built: CMS websites, custom-coded front ends, email campaigns and API components."
    ></include>
  </head>
  <body class="page-work">
    <include src="header.html"></include>

    <!--
      Work: everything I've built, in four categories (from "What I have built" in the V5 Studio design).
      Each category is a row: number, name and blurb on the left, its projects on the right.
      Cards: partials/work-card-site.html (a website screenshot) and partials/work-card-email.html (an email).
      Anything in [square brackets] is a placeholder to replace with a real project.
    -->
    <main id="main" class="work-page work-page--feature">
      <!--
        Work page, version 2: just the hero, with a laptop holding the Nueva Gold website (linking to its case study)
        instead of the carousel of three projects.
        The quote is from "Chapter IV · My Work" in the V5 Studio design.
        The background is the home page hero's: the pink-to-blue gradient and the hexagon facets (partials/hero-hex.html).
        data-header-over makes the header see-through over it, like the home page (src/scss/layout/_header.scss).
      -->
      <section class="work-showcase" aria-labelledby="work-title" data-header-over>
        <div class="work-showcase__facets" aria-hidden="true">
          <include src="hero-hex.html"></include>
        </div>

        <div class="container work-showcase__inner">
          <p class="eyebrow" data-reveal>Featured Client</p>
          <h1 class="work-showcase__title" id="work-title" data-reveal>Nueva <span class="accent-word">Gold</span></h1>

          <include src="work-laptop.html" variant="" href="/work/nueva-gold/" image="/images/work/nueva-gold/home-full.webp" height="5482" address="nuevagold.com" label="The Nueva Gold website on a laptop: see the case study" priority="high"></include>

          <p class="work-showcase__quote" data-reveal>Functional art for every user and ease for every client CMS.</p>
        </div>
      </section>
    </main>

    <include src="footer.html"></include>
  </body>
</html>
