<!doctype html>
<html lang="en">
  <head>
    <include src="head.html" title="Page not found — Gemma Gentles" description="This page doesn't exist."></include>
  </head>
  <body class="page-404">
    <include src="header.html"></include>

    <main id="main">
      <!--
        The 404 page, styled like the home hero: the brand gradient filling the screen (the header see-through over
        it, from data-header-over), "PAGE NOT" in black over an outlined "FOUND", a line of text, a black and an
        outlined button, and a few pages to try (hexagon bullets). A giant outlined "404" sits behind it, like "NEXT"
        in the call to action. Styles: src/scss/pages/_not-found.scss.
      -->
      <section class="not-found" aria-labelledby="not-found-title" data-header-over>
        <span class="not-found__ghost" aria-hidden="true">404</span>

        <div class="not-found__content container">
          <p class="eyebrow not-found__eyebrow">Error 404</p>
          <h1 class="not-found__title" id="not-found-title">Page not <span class="not-found__accent">found</span></h1>
          <p class="not-found__text">That link doesn't go anywhere. The page may have moved, or there's a typo in the address.</p>
          <div class="not-found__actions">
            <a class="button not-found__primary" href="/">Back to home</a>
            <a class="button button--ghost not-found__ghost-button" href="/work/">See my work</a>
          </div>
          <nav class="not-found__more" aria-label="Pages to try">
            <p class="not-found__label">Or try</p>
            <ul class="not-found__links">
              <li><a href="/#about">About me</a></li>
              <li><a href="/#process">My process</a></li>
              <li><a href="/work/nueva-gold/">A case study</a></li>
              <li><a href="/contact/">Contact</a></li>
            </ul>
          </nav>
        </div>
      </section>
    </main>

    <include src="footer.html"></include>
  </body>
</html>
