<!doctype html>
<html lang="en">
  <head>
    <include src="head.html" title="Page not found — Gemma Gentles" description="This page doesn't exist."></include>
  </head>
  <body class="page-404">
    <include src="header.html"></include>

    <main id="main">
      <!--
        The 404 page, in the brand hero style (like the home hero, shared with Contact): "PAGE NOT" in black over an
        outlined "FOUND", a line of text, a black and an outlined button, and a few pages to try (hexagon bullets),
        with a giant outlined "404" behind. Styles: src/scss/components/_brand-hero.scss.
      -->
      <section class="brand-hero" aria-labelledby="not-found-title" data-header-over>
        <span class="brand-hero__ghost" aria-hidden="true">404</span>

        <div class="brand-hero__content container">
          <p class="eyebrow brand-hero__eyebrow">Error 404</p>
          <h1 class="brand-hero__title" id="not-found-title">Page not <span class="brand-hero__accent">found</span></h1>
          <p class="brand-hero__text">That link doesn't go anywhere. The page may have moved, or there's a typo in the address.</p>
          <div class="brand-hero__actions">
            <a class="button brand-hero__primary" href="/">Back to home</a>
            <a class="button button--ghost brand-hero__secondary" href="/work/">See my work</a>
          </div>
          <nav class="brand-hero__more" aria-label="Pages to try">
            <p class="brand-hero__label">Or try</p>
            <ul class="brand-hero__links">
              <li><a href="/#about">About me</a></li>
              <li><a href="/#process">My process</a></li>
              <li><a href="/work/nueva-gold/">A case study</a></li>
              <li><a href="/contact/">Contact</a></li>
            </ul>
          </nav>
        </div>
      </section>
    </main>

    <include src="footer.html"></include>
  </body>
</html>
