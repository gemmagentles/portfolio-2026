<!doctype html>
<html lang="en">
  <head>
    <include
      src="head.html"
      title="Gemma Gentles Portfolio · Front-End Developer in Vancouver"
      description="Portfolio of Gemma Gentles, a front-end web developer building fast, accessible, hand-coded websites."
    ></include>
  </head>
  <body class="page-home">
    <include src="header.html"></include>

    <main id="main">
      <!--
        Hero (from "Hero V15" in the design): a diagonal pink-to-blue gradient, with the heading, line and buttons on the
        left and, from lg up, a phone on the right (partials/hero-phone.html) that loops between a wireframe and the
        finished screen, over a hexagon of geometric facets (partials/hero-hex.html). Below lg the phone sits under the text.
        Styles in src/scss/pages/_home.scss.
        (.hero__wrapper is also how src/js/modules/header.js knows when the hero has scrolled away.)
        data-header-over makes the header see-through over it (src/scss/layout/_header.scss).
        A giant outlined "PORTFOLIO", like "NEXT" in the call to action (partials/cta.html), runs along the bottom.
      -->
      <section class="hero__wrapper" aria-labelledby="hero-title" data-header-over>
        <span class="hero__word" aria-hidden="true">Portfolio</span>

        <div class="hero container">
          <div class="hero__text">
            <!-- Hidden for now: remove the "hidden" attribute to bring the "Open to work" line back. -->
            <p class="hero__status" hidden><span class="hero__dot" aria-hidden="true"></span>Open to work · Vancouver / Remote</p>
            <h1 class="hero__title" id="hero-title">Front-End <span class="hero__accent">Developer</span></h1>
            <p class="hero__tagline">Turning designs into pixel&#8209;perfect, responsive and accessible user interfaces.</p>
            <div class="hero__actions">
              <a class="button hero__primary" href="/work/">See my work</a>
              <a class="button button--ghost hero__ghost" href="/contact/">Get in touch</a>
            </div>
          </div>

          <div class="hero__visual" aria-hidden="true">
            <include src="hero-hex.html"></include>
            <include src="hero-phone.html"></include>
          </div>
        </div>
      </section>

      <include
        src="statement.html"
        id="intro"
        theme="dark"
        eyebrow="Prologue · Hi, I'm Gemma"
        title="Designer turned"
        accent="developer"
        text="I started out designing and building sites for a startup agency, so I understand both sides of the handoff. I've worked solo and as part of a team, with small, medium and large businesses. Today I specialize in front-end development, from CMS websites to custom API components. I love bringing ideas to life, and finding ways to make a user's experience easier."
      ></include>

      <include src="about.html"></include>

      <include src="work-grid.html"></include>

      <include
        src="statement.html"
        id="skills"
        theme="light"
        eyebrow="Chapter III · How I work"
        title="My typical"
        accent="workflow"
        text="I take Jira tickets from a Kanban board, check the design in Figma and start the build in VS Code. For custom builds I use a task runner like Grunt.js or a local development server like Vite, and for full CMS sites I use LocalWP and set up WordPress with ACF. In any case, I always style with SCSS, using variables and imports to maximize efficiency."
      ></include>

      <include src="tools-icon-grid.html"></include>

      <include src="work-browser.html"></include>

      <include src="clients.html"></include>

      <include
        src="statement.html"
        id="craft"
        theme="light"
        eyebrow="Chapter VII · My favourite type of work"
        title="Building a user"
        accent="experience"
        text="I love being given a design and bringing it to life, making it interactive. When bigger clients have multiple use cases for one feature, it fascinates me to build one component that handles them all. I enjoy problem solving and creating a solution for a customer, client or teammate."
      ></include>

      <include src="process.html"></include>

      <include src="what-you-get.html"></include>

      <include src="why-it-matters.html"></include>

      <include
        src="cta.html"
        eyebrow="Like what you see?"
        title="Let's build"
        title2="something"
        accent="together."
        ghost="Hello"
        button="Get in touch"
        href="/contact/"
        target="_self"
        note=""
      ></include>
    </main>

    <include src="footer.html"></include>
  </body>
</html>
